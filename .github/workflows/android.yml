name: Android CI

# Default for every job: read-only. Write scopes are granted per job below, and
# only to the job that actually needs them (release → contents: write,
# diagnostics → issues: write). The build job never gets a writable token.
permissions:
  contents: read

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Show toolchain
        run: |
          mkdir -p ci-logs
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
          ./gradlew --version

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest 2>&1 | tee ci-logs/tests.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain :app:assembleDebug 2>&1 | tee ci-logs/debug.log

      - name: Build release APK (R8, unsigned)
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain :app:assembleRelease 2>&1 | tee ci-logs/release.log

      # Lint is a gate now, not a warning: AGP fails the task on lint errors and
      # the next step double-checks the text report for "Error:" lines.
      - name: Android Lint
        id: lint
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain :app:lintDebug 2>&1 | tee ci-logs/lint.log
          find app/build -name "lint-results-debug.txt" -print -quit | xargs -r -I{} cp {} ci-logs/lint-report.txt || true

      - name: Enforce zero lint errors
        run: |
          set -o pipefail
          if [ ! -f ci-logs/lint-report.txt ]; then
            echo "lint report missing"; exit 1
          fi
          ERRORS=$(grep -cE "^[^ ].*: Error: " ci-logs/lint-report.txt || true)
          echo "lint errors: $ERRORS"
          grep -E ": Error: " ci-logs/lint-report.txt || true
          if [ "$ERRORS" != "0" ]; then
            echo "::error::$ERRORS Android Lint error(s) found"
            exit 1
          fi

      - name: Verify debug APK (badging + signature)
        run: |
          set -o pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          {
            echo "### APK verification"
            echo "build-tools: $BT"
            "$BT/aapt2" dump badging "$APK" | grep -E "package:|sdkVersion|targetSdkVersion|application-label|uses-permission" | head -30
            echo "--- signature ---"
            "$BT/apksigner" verify --verbose "$APK"
            echo "--- sha256 ---"
            sha256sum "$APK"
            echo "--- size ---"
            ls -lh "$APK"
          } | tee ci-logs/apk-verify.txt

      - name: Summarize unit tests
        if: always()
        run: |
          python3 - <<'PY' | tee ci-logs/test-summary.txt
          import glob, xml.etree.ElementTree as ET
          tests = failures = errors = skipped = 0
          for path in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              root = ET.parse(path).getroot()
              tests += int(root.get("tests", 0))
              failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))
          print(f"tests={tests} failures={failures} errors={errors} skipped={skipped}")
          PY

      - name: Upload APKs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: myai-build
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/test-results/testDebugUnitTest/*.xml
            ci-logs/*

  # Publishing is a separate job with its own write scope, and it only runs for a
  # push to main. Pull requests, feature branches and manual runs build but never
  # publish. The build job above cannot write to the repository even if it wanted to.
  release:
    name: Publish release asset (main only)
    needs: build
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'slam27893-del/Mla'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: myai-build
          path: dist

      - name: Publish debug APK as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="dist/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          TAG="v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "MyAI ${VERSION}" \
              --notes "بناء آلي موقّع بمفتاح debug للتثبيت والتجربة. راجع README لطريقة التثبيت على Honor 400." \
              --latest
          fi
          gh release delete-asset "$TAG" app-debug.apk -y >/dev/null 2>&1 || true
          gh release delete-asset "$TAG" app-release-unsigned.apk -y >/dev/null 2>&1 || true
          cp "$APK" "$RUNNER_TEMP/MyAI-${VERSION}-debug.apk"
          gh release upload "$TAG" "$RUNNER_TEMP/MyAI-${VERSION}-debug.apk" --clobber

  # Diagnostics comments on the CI log issue. Split into its own job so the build
  # job keeps a read-only token; it runs even when the build fails, which is
  # exactly when the log matters.
  diagnostics:
    name: Publish diagnostics
    needs: build
    if: always() && github.event_name == 'push' && github.repository == 'slam27893-del/Mla'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Download reports
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: myai-build
          path: dist

      - name: Publish diagnostics to the CI log issue
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job: tell gh which repository it is talking to.
          GH_REPO: ${{ github.repository }}
          JOB_STATUS: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          ISSUE=$(gh issue list --state all --search 'CI build log in:title' --json number --jq '.[0].number // empty')
          if [ -z "$ISSUE" ]; then
            ISSUE=$(gh api "repos/$GITHUB_REPOSITORY/issues" -X POST \
              -f title='CI build log (auto)' \
              -f body='سجل تشخيص آلي لعمليات البناء والاختبار.' --jq .number)
          fi

          {
            echo "### 📋 MyAI CI — \`${JOB_STATUS}\`"
            echo ""
            echo "- **الفرع:** \`${GITHUB_REF_NAME}\`"
            echo "- **الالتزام:** \`${GITHUB_SHA}\`"
            echo "- **التشغيل:** [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo "- **النشر:** لا يُنشر أي إصدار إلا من \`main\`."
            echo ""
            for log in tests debug release lint; do
              FILE="dist/ci-logs/${log}.log"
              if [ -f "$FILE" ]; then
                echo "<details open><summary><b>${log}.log — key errors</b></summary>"
                echo ""
                echo '```'
                grep -nE "^e: |^w: |error:|Error:|What went wrong|FAILED|FAILURE:|Caused by|Unresolved reference|Missing class" "$FILE" | head -120 || true
                echo '```'
                echo "</details>"
                echo ""
                echo "<details><summary><b>${log}.log</b> (tail)</summary>"
                echo ""
                echo '```'
                tail -c 20000 "$FILE" || true
                echo '```'
                echo "</details>"
                echo ""
              fi
            done
            for extra in test-summary apk-verify lint-report; do
              FILE="dist/ci-logs/${extra}.txt"
              if [ -f "$FILE" ]; then
                echo "<details><summary><b>${extra}</b></summary>"
                echo ""
                echo '```'
                head -c 12000 "$FILE" || true
                echo '```'
                echo "</details>"
                echo ""
              fi
            done
            if ls dist/app/build/test-results/testDebugUnitTest/*.xml >/dev/null 2>&1; then
              echo "<details><summary><b>test failures</b></summary>"
              echo ""
              echo '```'
              grep -h -A4 '<failure' dist/app/build/test-results/testDebugUnitTest/*.xml | head -80 || true
              echo '```'
              echo "</details>"
            fi
          } > "$RUNNER_TEMP/comment.md"

          gh api "repos/$GITHUB_REPOSITORY/issues/${ISSUE}/comments" \
            -X POST -F "body=@$RUNNER_TEMP/comment.md" --jq .html_url
